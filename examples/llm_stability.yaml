# llm-provider-sdk 示例配置

llm_stability:

  # === 提供商凭证 ===
  # 一个提供商可暴露多个协议端点：openai / openai_responses / anthropic / google
  providers:
    openai-next:
      api_key: "sk-xxx"
      endpoints:
        openai:
          base_url: "https://api.openai-next.com/v1"
        anthropic:
          base_url: "https://api.openai-next.com/anthropic/v1"

    ppio:
      api_key: "sk-yyy"
      endpoints:
        openai:
          base_url: "https://api.ppinfra.com/openai/v1"
        anthropic:
          base_url: "https://api.ppinfra.com/anthropic/v1"

    volces:
      api_key: "sk-zzz"
      endpoints:
        openai:
          base_url: "https://ark.cn-beijing.volces.com/api/v3"

  # === 模型定义 ===
  # key = 模型名；每个提供商条目指定 endpoint 类型和实际 model_id（省略则同 key）
  models:
    claude-opus-4-5-20251101:
      providers:
        - provider: openai-next
          endpoint: openai
          model_id: "claude-opus-4-5-20251101"

    gpt-4.1-2025-04-14:
      providers:
        - provider: openai-next
          endpoint: openai

    deepseek-v3-2-251201:
      providers:
        - provider: volces
          endpoint: openai
        - provider: ppio
          endpoint: openai
          model_id: "deepseek-chat"      # ppio uses "deepseek-chat"

  # === 业务策略 ===
  # business_key → 一个降级池。每次请求按权重和实时表现抽一个模型，失败或首 token 太慢就换池子里下一个。
  # weight 越大越想命中；first_token 超过就换下一个；fast_first_token 以内算满分。
  strategies:
    requirement_clarify:
      pool:
        - model: claude-opus-4-5-20251101
          weight: 10
        - model: gpt-4.1-2025-04-14
          weight: 3
        - model: deepseek-v3-2-251201
          weight: 1
      timeout:
        per_request: 120
        first_token: 10
        fast_first_token: 2

    code_generation:
      pool:
        - model: deepseek-v3-2-251201
          weight: 10
        - model: gpt-4.1-2025-04-14
          weight: 1
      timeout:
        per_request: 60
        first_token: 10
        fast_first_token: 2

    chat:
      pool:
        - model: gpt-4.1-2025-04-14
          weight: 10
        - model: deepseek-v3-2-251201
          weight: 1
      timeout:
        per_request: 60
        first_token: 10
        fast_first_token: 2
